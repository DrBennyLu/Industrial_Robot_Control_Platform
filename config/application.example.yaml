# Copy to application.yaml and adjust. Do not commit secrets — use env vars.
robot:
  ip: "192.168.2.64"
  use_grpc: true
  username: ""
  # If set, password is read from this environment variable (controller >= V3.2.10)
  password_env: "JAKA_SDK_PASSWORD"

paths:
  teach_points: "data/teach_points.json"
  default_main_flow: "flows/main_flow.py"
  # 主流程关键状态快照目录（自动创建）
  snapshot_dir: "logs/snapshots"

logging:
  level: "INFO"
